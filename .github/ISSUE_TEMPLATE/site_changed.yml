name: Site changed
description: Sleep Number changed something and the parser no longer matches.
title: "[site] "
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the scraper used to work on a URL and now returns fewer
        rows, empty columns, or nothing at all — the usual cause is that
        something on www.sleepnumber.com moved.

        **What this scraper depends on**, roughly in order of how likely each
        is to break:

        - **The React Router hydration payload**, which is where every row
          comes from:
          `window.__reactRouterContext.streamController.enqueue("[…]")`, a
          turbo-stream document decoded by
          `product_parser.decode_turbo_stream`. A listing exposes the
          products at `category.products[]`, a detail page at `.product`.
          If that moves, rows come back empty or fall to the URL-pattern
          fallback with null prices.
        - **The field names** the parser reads inside it: the variant `sku`,
          `sale` / `regular` as integer `cents` with `currency_iso`.
        - **The JSON-LD**, used only to confirm prices where an `ItemList`
          is present. If this breaks you lose the confirmation recorded in
          `price_source` and nothing else.
        - **CloudFront's refusal page**, which is how a block is recognised:
          `Request blocked`, `Generated by cloudfront`, plus the absence of
          the site's own `cdn.sleepnumber.com` assets.

        Please say which of these it looks like if you can — but a URL and an
        exit code is plenty to start.

  - type: input
    id: url
    attributes:
      label: The URL
      placeholder: "https://www.sleepnumber.com/categories/mattresses (mode: listing, headless bundled Chromium, exit: US residential)"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What happens
      options:
        - Zero rows (exit 4) on a listing that has products
        - Fewer rows than the site shows
        - Rows arrive but a column is empty that used to be filled
        - Blocked (exit 3) where it used to be served
        - Partial (exit 6) — a page failed mid-run
        - Something else
    validations:
      required: true

  - type: textarea
    id: dump
    attributes:
      label: What the scraper saw
      description: |
        Re-run with `--dump-html out.html`. That writes the exact document
        the parser was given, on success as well as failure; the rows come
        from the `__reactRouterContext` payload inside it.

        Please attach the dump, or say what the payload looks like, and
        paste the `*.meta.json` sidecar if the run wrote one.
      render: shell

  - type: textarea
    id: notes
    attributes:
      label: Anything else
