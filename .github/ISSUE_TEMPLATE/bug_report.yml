name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw dumps do not. Replace them
        with `***`.

        A few things answer most reports faster than we can:

        - **Everything exit 3?** Check the ADDRESS first. Measured
          2026-09-17: every URL on www.sleepnumber.com answers a datacentre
          address with an identical 919-byte CloudFront "Request blocked"
          403, whatever the client, while GB and US residential exits were
          served 200. A VPS, CI runner or container needs a residential
          `--proxy` or `--cdp-endpoint`. A captcha solve buys nothing: the
          refusal has no widget on it.
        - **`original_price` and `discount_pct` null on most rows?**
          Expected where nothing is discounted — the regular price equals
          the sale price on 198 of 211 variants of the sheets category, and
          a was-price equal to the price would put a 0% discount on them.
        - **`rating` and `review_count` both null?** Expected on an
          unreviewed product: the site reports 0 and both go null together.
        - **Zero rows (exit 4) on a `/categories/…` URL?** Some are curated
          landing pages with no product list at all (`beds-on-sale`); the
          log says `no_listing` for those. If the page is a real category
          and the parser produced none, that is a bug and this is the right
          issue. See [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things — 3 is
        blocked, 4 is "ran fine, found nothing", 6 is partial. The table is in
        the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --category mattresses \
          --out mattresses
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: >-
        The last ~30 lines are usually enough. If the run wrote a
        `*.meta.json` sidecar, please include it — `status`, `stop_reason`,
        `pages_failed` and the site's own `total_results` / `per_page` answer
        most of what we would otherwise ask.
      render: shell
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
